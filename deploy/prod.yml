apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{app}}
  namespace: {{team}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 3000
  ingresses:
    - https://sas-epics.ansatt.nav.no
  accessPolicy:
    outbound:
      external:
        - host: api.github.com
        - host: avatars.githubusercontent.com
  liveness:
    path: /api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /api/internal/isReady
    initialDelay: 10
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  observability:
    logging:
      destinations:
        - id: loki
  envFrom:
    - secret: sp-sas-ticket-graf
