apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{app}}
  namespace: {{team}}
  labels:
    team: {{team}}
spec:
  image: {{image}}
  port: 3000
  ingresses:
    - https://sas-epics.ansatt.nav.no
  accessPolicy:
    outbound:
      external:
        - host: api.github.com
        - host: avatars.githubusercontent.com
  liveness:
    path: /api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /api/internal/isReady
    initialDelay: 10
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  observability:
    logging:
      destinations:
        - id: loki
  azure:
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /_next/static/*
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          - id: 'f787f900-6697-440d-a086-d5bb56e26a9c' # tbd
          - id: 'c0227409-2085-4eb2-b487-c4ba270986a3' # nais-team-tbd
  envFrom:
    - secret: sp-sas-ticket-graf
